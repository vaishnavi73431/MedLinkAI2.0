<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PixelGarden</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      /* Switched to rounder font for cozy vibe */
    }

    /* Custom scrollbar for retro feel */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #576b4b;
    }

    ::-webkit-scrollbar-thumb {
      background: #8aa878;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #a3c48f;
    }

    .pixel-corners {
      border-radius: 12px;
      /* Smoother corners for the new style */
    }
  </style>
